[project]
name = "cancer-workbench"
version = "0.1.0"
description = "Researcher-focused cancer AI workspace: registry, routing, dataset audit, coordinator."
requires-python = ">=3.11"
# Core is standard-library only. Extras are pinned exactly; versions were checked
# on 2026-10-23 to be >= 2 weeks old with no known compromise. Re-check before bumping.
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy==2.5.3",
  "pillow==12.3.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "timm==1.0.30",
  "transformers==5.19.0",
  "safetensors==0.8.0",
  "scikit-learn==1.9.1",
]
clip = ["open_clip_torch==3.3.0"]
imaging = ["pydicom==3.0.2", "nibabel==5.4.2", "monai==1.6.1"]

[project.scripts]
cancer-workbench = "cancer_workbench.__main__:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cancer_workbench*"]
